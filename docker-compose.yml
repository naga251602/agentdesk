# Default: just the API (in-process index, optional JSON persistence).
# `docker compose --profile prod up` adds Postgres+pgvector and Redis for the
# scale-out wiring described in the README.
services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      AGENTDESK_ESCALATION_THRESHOLD: "0.70"
      # Point these at a vLLM server to switch from extractive to LLM mode:
      # LLM_BASE_URL: http://host.docker.internal:8001/v1
      # LLM_MODEL: meta-llama/Llama-3.2-3B-Instruct
    volumes:
      - agentdesk-data:/srv/agentdesk/data

  postgres:
    profiles: ["prod"]
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: agentdesk
      POSTGRES_USER: agentdesk
      POSTGRES_PASSWORD: agentdesk
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data

  redis:
    profiles: ["prod"]
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  agentdesk-data:
  pg-data:
